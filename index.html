<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #1f2937; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .6rem; font: inherit; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: .5rem 1rem; font: inherit; border: 1px solid #2563eb; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { margin-top: 1rem; padding: .75rem 1rem; border-radius: 6px; border: 1px solid transparent; }
    .status.loading { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }
    .status.ready { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
    .status.warning { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
    .status.error { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
    .result { margin-top: 1rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; }
    .result-row { margin: 0 0 .75rem; }
    .result-row:last-child { margin-bottom: 0; }
    .draft-text { margin: .35rem 0 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form id="triage-form">
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" placeholder="Введите текст заявки клиента…"></textarea>
    <button type="submit" id="submit-btn">Разобрать заявку</button>
  </form>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <section id="result" class="result" aria-label="Результат разбора" hidden>
    <p class="result-row"><strong>Тема:</strong> <span id="topic"></span></p>
    <div class="result-row">
      <strong>Черновик ответа:</strong>
      <p id="draft" class="draft-text"></p>
    </div>
  </section>

  <script type="module">
    const form = document.querySelector("#triage-form");
    const messageEl = document.querySelector("#message");
    const submitBtn = document.querySelector("#submit-btn");
    const statusEl = document.querySelector("#status");
    const resultEl = document.querySelector("#result");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");

    const TOPIC_LABELS = {
      delivery: "Доставка (delivery)",
      pricing: "Стоимость и цены (pricing)",
      other: "Другое (other)",
    };

    function clearDraft() {
      topicEl.textContent = "";
      draftEl.textContent = "";
      resultEl.hidden = true;
    }

    function showStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`;
      statusEl.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      showStatus("Разбираем заявку…", "loading");

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: messageEl.value }),
        });

        let data = null;
        try {
          data = await reply.json();
        } catch {
          data = null;
        }

        if (reply.status === 400 && data?.status === "invalid_input") {
          clearDraft();
          showStatus("Введите текст заявки — поле не может быть пустым.", "error");
          return;
        }

        if (
          reply.ok &&
          data?.status === "ready" &&
          typeof data.topic === "string" &&
          typeof data.draft === "string" &&
          data.draft.trim().length > 0
        ) {
          topicEl.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
          draftEl.textContent = data.draft;
          resultEl.hidden = false;
          showStatus("Черновик готов. Проверьте текст перед отправкой клиенту.", "ready");
          return;
        }

        if (reply.ok && data?.status === "manual_review") {
          clearDraft();
          showStatus(
            "Автоматический разбор не удался — требуется ручной разбор. Предыдущий черновик очищен.",
            "warning",
          );
          return;
        }

        clearDraft();
        showStatus("Не удалось обработать заявку. Передайте её на ручной разбор.", "error");
      } catch {
        clearDraft();
        showStatus("Ошибка связи с сервером. Передайте заявку на ручной разбор.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
